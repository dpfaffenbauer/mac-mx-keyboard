name: Build plugin package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Logi Plugin Tool
        run: dotnet tool install --global LogiPluginTool

      - name: Build
        run: dotnet build MacKeysPlugin/MacKeysPlugin.slnx -c Release

      - name: Pack and verify
        id: pack
        run: |
          version=$(sed -n 's/^version: *//p' MacKeysPlugin/src/package/metadata/LoupedeckPackage.yaml | tr -d '\r')
          file="dist/MacKeys_${version//./_}.lplug4"
          mkdir -p dist
          logiplugintool pack MacKeysPlugin/bin/Release/ "$file"
          logiplugintool verify "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: ${{ steps.pack.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber
